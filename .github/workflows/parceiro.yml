name: parceiro-jornaldapb
# Vídeos do @jornaldapb (só os que NÃO são collab, como prevê a autorização) refeitos com a marca
# do PB Minuto: a cada 20 min, 24 horas por dia, 7 dias por semana. Por padrão são publicados direto
# (pedido do Arthur); a variável PARCEIRO_MODO = review volta a usar a fila queue/parceiro.
on:
  schedule:
    - cron: "2,22,42 * * * *"
  workflow_dispatch:
    inputs:
      acao:
        description: "rodada (busca vídeos novos), aprovar (publica a fila), descartar (tira um da fila), calibrar (quadros com grade) ou testar (só baixa o Reel mais recente)"
        type: choice
        options: [rodada, aprovar, descartar, calibrar, testar, refazer, amostra]
        default: rodada
      modo:
        description: "na rodada: review (fila), auto (publica) ou dry (só prévia)"
        type: choice
        options: [padrao, review, auto, dry]
        default: padrao
      id:
        description: "aprovar/descartar: ID da fila (vazio em aprovar = todos); refazer: IDs dos Reels do parceiro"
        required: false
        default: ""

permissions:
  contents: write
  actions: write      # o vigia religa a sequência de notícias (publicar-noticias)

concurrency:
  group: parceiro
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # vídeos longos de vários parceiros na mesma rodada
    steps:
      - uses: actions/checkout@v4
      - run: git pull --ff-only origin main || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Instalar FFmpeg
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
      - name: Guardar o modelo do Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ vars.WHISPER_MODELO || 'small' }}
      - name: Parceiro
        env:
          ACAO: ${{ github.event.inputs.acao || 'rodada' }}
          MODO: ${{ github.event.inputs.modo }}
          ID: ${{ github.event.inputs.id }}
          PARCEIRO_USUARIO: ${{ vars.PARCEIRO_USUARIO }}
          PARCEIRO_LISTA: ${{ vars.PARCEIRO_LISTA }}
          PARCEIRO_AUTO_MARCA: ${{ vars.PARCEIRO_AUTO_MARCA }}
          PARCEIRO_MODO: ${{ vars.PARCEIRO_MODO }}
          PARCEIRO_COBRIR: ${{ vars.PARCEIRO_COBRIR }}
          PARCEIRO_CORTE: ${{ vars.PARCEIRO_CORTE }}
          PARCEIRO_DEGRADE: ${{ vars.PARCEIRO_DEGRADE }}
          PARCEIRO_JANELA_HORAS: ${{ vars.PARCEIRO_JANELA_HORAS }}
          PARCEIRO_SINAIS_COLLAB: ${{ vars.PARCEIRO_SINAIS_COLLAB }}
          PARCEIRO_BAIXAR_PAGINA: ${{ vars.PARCEIRO_BAIXAR_PAGINA }}
          PARCEIRO_IG_COOKIES: ${{ secrets.PARCEIRO_IG_COOKIES }}
          PORTAL_NAME: ${{ vars.PORTAL_NAME }}
          PORTAL_HANDLE: ${{ vars.PORTAL_HANDLE }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          WHISPER_MODELO: ${{ vars.WHISPER_MODELO }}
          HUMANIZAR: ${{ vars.HUMANIZAR }}
        run: |
          case "$ACAO" in
            aprovar)   if [ -n "$ID" ]; then python main.py parceiro-aprovar "$ID"; else python main.py parceiro-aprovar --all; fi ;;
            descartar) python main.py parceiro-descartar "$ID" ;;
            calibrar)  python main.py parceiro-calibrar ;;
            testar)    python main.py parceiro-testar ;;
            refazer)   python main.py parceiro-refazer $ID ;;
            amostra)   python main.py parceiro-amostra "$ID" ;;
            *)         if [ -n "$MODO" ] && [ "$MODO" != "padrao" ]; then python main.py parceiro --modo "$MODO"; else python main.py parceiro; fi
                       python main.py parceiro-fila ;;
          esac
      - name: Prévia (quadros e vídeos no ramo "previa-parceiro")
        if: always()
        run: |
          shopt -s nullglob
          arquivos=(out/calibrar_*.jpg out/parceiro_*[0-9].mp4)
          [ ${#arquivos[@]} -eq 0 ] && exit 0
          git worktree add --orphan -b previa-parceiro /tmp/previa
          for v in out/parceiro_*[0-9].mp4; do
            b=$(basename "$v" .mp4)
            for s in 1 4; do ffmpeg -loglevel error -y -ss $s -i "$v" -frames:v 1 -vf scale=540:-1 "/tmp/previa/${b}_${s}s.jpg" || true; done
            cp "$v" /tmp/previa/
          done
          cp out/calibrar_*.jpg out/calibrar_*.json /tmp/previa/ 2>/dev/null || true
          cd /tmp/previa
          git add -A
          git -c user.name="pbminuto-bot" -c user.email="pbminuto-bot@users.noreply.github.com" commit -qm "prévia parceiro $(date -u +%F_%H%M)" || exit 0
          git push -f origin previa-parceiro
      - name: Vigia do PB Minuto (religa a sequência de notícias se ela parou)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # o PB Minuto roda 24h, 7 dias por semana: se não houver rodada de notícias ativa e a
          # última começou há mais de 15 min, a sequência caiu (ex.: agendamento do GitHub falhou)
          ativos=$(gh run list -R "$GITHUB_REPOSITORY" --workflow publicar.yml --json status \
            --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending")] | length')
          if [ "$ativos" -gt 0 ]; then echo "sequência de notícias ativa"; exit 0; fi
          ultima=$(gh run list -R "$GITHUB_REPOSITORY" --workflow publicar.yml -L 1 --json createdAt --jq '.[0].createdAt')
          idade=$(( $(date +%s) - $(date -d "${ultima:-1970-01-01T00:00:00Z}" +%s) ))
          if [ "$idade" -gt 900 ]; then
            echo "sequência parada há $((idade / 60)) min: religando"
            gh workflow run publicar.yml -R "$GITHUB_REPOSITORY" -f modo=auto
          else
            echo "última rodada há $((idade / 60)) min: ok"
          fi
      - name: Salvar estado e fila
        if: always()
        run: |
          git config user.name "pbminuto-bot"
          git config user.email "pbminuto-bot@users.noreply.github.com"
          git add -A state/parceiro.json queue/parceiro 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "parceiro $(date -u +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
