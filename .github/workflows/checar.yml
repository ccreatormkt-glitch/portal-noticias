name: checar-configuracao
# Rode manualmente depois de cadastrar as chaves: testa IA, Instagram, hospedagem e fontes.
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUNBUFFERED: "1"  # mostra cada etapa no registro na hora

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
      - env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          python main.py check
          python main.py check-feeds
          echo "Modelos do Gemini disponíveis:"
          python main.py modelos
          echo "Diagnóstico do envio de Reels (não publica nada):"
          python main.py teste-upload || true
