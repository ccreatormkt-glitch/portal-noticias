name: testes
# Roda a suíte de testes a cada mudança no código. Se algo quebrar, o GitHub avisa por e-mail.
on:
  push:
    branches: [main]   # os ramos "previa" e "midia" só guardam imagens e vídeos
    paths-ignore: ["state/**", "queue/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUNBUFFERED: "1"  # mostra cada etapa no registro na hora

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
